name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: native/webrtc-publisher/go.sum
      - name: Verify version and tests
        run: |
          VERSION="$(tr -d '[:space:]' <VERSION)"
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
          cmake -S . -B build -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          (cd native/webrtc-publisher && go test ./...)
          bash -n scripts/*.sh native/desktop-streamer/*.sh docker/*
      - name: Build Release assets
        run: ./scripts/build-release.sh
      - name: Verify ARM64 publisher is bundled
        run: |
          ./dist/RemyDesk-RK3588-installer.sh --verify-only
          grep -q 'RemyDesk-RK3588-installer.sh' dist/SHA256SUMS
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
